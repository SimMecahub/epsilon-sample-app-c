name: Build app NumWorks
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer le compilateur ARM
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi
      - name: Preparer les fichiers
        run: |
          [ -f main.c ] && cp main.c src/main.c
          TEX=$(ls *.tex | head -n 1)
          python3 tex2h.py "$TEX" --out src/doc.h
      - name: Compiler
        run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: app-nwa
          path: output/app.nwa
